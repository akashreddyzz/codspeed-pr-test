name: CodSpeed Benchmarks
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-codspeed
      - uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: pytest benchmarks --codspeed
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-codspeed
      - uses: CodSpeedHQ/action@v5
        with:
          mode: memory
          run: pytest benchmarks --codspeed
